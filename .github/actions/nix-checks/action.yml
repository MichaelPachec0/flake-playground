name: "Nix flake checks"
description: "Set up Nix, optionally regenerate inputs, then build every flake check in parallel with nix-fast-build."

inputs:
  pre-build-command:
    description: "Optional shell command run after Nix is set up but before the checks build (e.g. nvfetcher or `nix flake update`). The cron bump workflows use this."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false

    # free-disk-space deletes the runner's default /mnt/swapfile, leaving the
    # 16 GB runner with zero swap. Nix eval + parallel builds spike past 16 GB
    # and stall the swapless VM until GitHub reclaims it ("runner received a
    # shutdown signal"). Re-add a generous swapfile as a pressure-relief valve.
    - name: Add swap space
      shell: bash
      run: |
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        # Pinned to 2.34.8 to dodge NixOS/nix#16005: a 2.35 scheduler regression
        # loses a goal's wakeup when two concurrent nix processes race for the
        # same derivation ("someone beat us to it"), and the daemon worker then
        # aborts on `Assertion '!awake.empty()' failed in nix::Worker::run`. That
        # is precisely nix-fast-build's shape here -- checks.default is a linkFarm
        # over every other check, so five clients contend for one closure.
        # The fix (NixOS/nix#16220) is on master and in no release yet: 2.35.1 is
        # the newest tag and does not contain it, so the only way out is backwards.
        # REVERT THIS COMMIT once a release ships the fix; the action's own
        # default is latest, which is where we want to be.
        install_url: https://releases.nixos.org/nix/nix-2.34.8/install
        # nix-command/flakes and access-tokens = $GITHUB_TOKEN are already set by
        # the action itself, so they are not repeated here. max-jobs IS worth
        # overriding: the action defaults it to `auto` (= 4 on a runner), and that
        # is the setting the DAEMON obeys. nix-fast-build's own --max-jobs only
        # bounds how many `nix build` clients it starts, so without this the two
        # multiply and peak build concurrency lands well above the intended cap.
        extra_nix_config: |
          max-jobs = 2
          cores = 2

    # Builders run as children of nix-daemon.service, so they live in its cgroup.
    # systemd's default OOMPolicy=stop tears down the WHOLE service when any
    # process in that cgroup is OOM-killed -- so one oversized builder takes the
    # daemon with it and every in-flight client reports
    #   error: Nix daemon disconnected unexpectedly (maybe it crashed?)
    # instead of a normal "builder failed" for the one derivation at fault.
    # OOMPolicy=continue keeps the daemon alive so an OOM surfaces as an ordinary
    # per-derivation failure. Insurance only -- the crashes this action was built
    # to chase turned out to be NixOS/nix#16005, not memory pressure (peak use was
    # 9.5 of 15 GB, swap untouched, no OOM lines in dmesg, systemd-oomd silent).
    - name: Harden nix-daemon against builder OOM
      shell: bash
      run: |
        # install-nix-action does a multi-user install on Linux runners, but bail
        # out politely rather than failing the job if that ever stops being true.
        if ! systemctl cat nix-daemon.service >/dev/null 2>&1; then
          echo "::warning::no nix-daemon.service unit -- skipping OOM hardening"
          exit 0
        fi
        sudo mkdir -p /etc/systemd/system/nix-daemon.service.d
        sudo tee /etc/systemd/system/nix-daemon.service.d/oom.conf >/dev/null <<'EOF'
        [Service]
        OOMPolicy=continue
        EOF
        sudo systemctl daemon-reload
        sudo systemctl restart nix-daemon.service
        # Evidence that the override actually took (shows up in the job log).
        systemctl show nix-daemon.service -p OOMPolicy -p ActiveState

    - name: Cache nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 5G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never

    - name: Regenerate inputs (optional)
      if: ${{ inputs.pre-build-command != '' }}
      shell: bash
      run: ${{ inputs.pre-build-command }}

    # Flakes only see files git knows about, so anything the previous step
    # CREATED (as opposed to modified in place) is invisible to the build that
    # follows and eval dies with "Path '...' in the repository is not tracked by
    # Git". nvfetcher does exactly that: the manifests it `extract`s land in
    # _sources/<source-hash>/, a directory whose name changes on every version
    # bump, so a bump day always produces brand-new untracked files.
    # `git add -AN` records intent-to-add only -- the paths become visible to
    # Nix without their contents being staged, leaving the commit step below in
    # charge of what actually gets committed.
    - name: Make regenerated inputs visible to Nix
      if: ${{ inputs.pre-build-command != '' }}
      shell: bash
      run: git add -AN .

    - name: Build all flake checks (nix-fast-build)
      shell: bash
      env:
        NIXPKGS_ALLOW_UNFREE: "1"
      run: |
        # In-flight resource sampler. A postmortem `free -h` says nothing after an
        # OOM kill -- the memory is free again by the time the step fails -- so
        # sample every 2s for the whole build and keep the log as an artifact.
        SAMPLE_LOG="$RUNNER_TEMP/nix-build-samples.log"
        (
          while :; do
            {
              printf '%s ' "$(date -u +%H:%M:%S)"
              free -m | awk '/^Mem:/  {printf "mem_used=%sM mem_avail=%sM ", $3, $7}
                             /^Swap:/ {printf "swap_used=%sM ", $3}'
              printf 'load=%s ' "$(cut -d' ' -f1-3 /proc/loadavg)"
              printf 'top:'
              ps -eo rss=,comm= --sort=-rss | head -n 5 |
                awk '{printf " %s=%dM", $2, $1 / 1024}'
              echo
            } 2>/dev/null
            sleep 2
          done
        ) >"$SAMPLE_LOG" 2>&1 &
        SAMPLER_PID=$!
        trap 'kill "$SAMPLER_PID" 2>/dev/null || true' EXIT

        # Bound concurrency so peak memory stays under the runner's 16 GB.
        # --eval-workers defaults to nproc (4), which over-subscribes RAM when
        # builds run alongside; 2 workers at the ~4.9 GiB our eval actually
        # peaks at is the real ceiling here. --eval-max-memory-size is NOT that
        # ceiling -- see below, it is a restart trigger, not an allocator limit.
        # --max-jobs here caps the `nix build` clients this spawns; the daemon's
        # own max-jobs is capped alongside it in the Install nix step above.
        # --retries 1: the NixOS/nix#16005 daemon crash is nondeterministic, so a
        # second attempt usually sails through. Without it a single lost wakeup
        # fails the whole job at attempt 1/1.
        #
        # --eval-max-memory-size 8192 (default 4096) dodges a nix-eval-jobs 2.35
        # shutdown race, NOT because eval needs 8 GiB. An eval worker compares
        # its ru_maxrss against this cap after every attr; over the cap it writes
        # "restart" to the collector and EXITS. Since 2.35's "unify worker
        # readiness handling" the collector claims the next job BEFORE reading
        # that "restart", so when the over-limit worker was handling the last
        # attr the collector writes "exit" into an already-dead pipe and aborts
        # the whole run with
        #   error: BUG: while sending exit, worker pipe got closed but
        #   evaluation worker still running?
        # after every attr has in fact evaluated fine. Our eval peaks around
        # 4.9 GiB per worker (ru_maxrss is a high-water mark, so once it crosses
        # the cap EVERY later attr re-arms the race), and whether the run dies
        # depends only on whether the queue happened to be empty at that moment
        # -- a coin flip. 8192 keeps each worker under the cap for the whole
        # eval, so it never self-restarts and the race never arms.
        # Note the nix pin above does NOT cover this: nix-eval-jobs comes from
        # whatever nixpkgs `nix run` resolves, independent of the client pin.
        # Drop back to the default once nix-eval-jobs reads worker status before
        # claiming a job again.
        status=0
        nix run nixpkgs#nix-fast-build -- \
          --flake ".#checks.x86_64-linux" \
          --skip-cached \
          --retries 1 \
          --no-nom \
          --eval-workers 2 \
          --eval-max-memory-size 8192 \
          --max-jobs 2 \
          --impure || status=$?

        # Log the tightest moment of the run even when it passes, so a run that
        # only just squeaked by is visible before it starts failing.
        echo "=== lowest-headroom sample of this build ==="
        awk '{
          for (i = 1; i <= NF; i++)
            if ($i ~ /^mem_avail=/) {
              v = $i; sub(/mem_avail=/, "", v); sub(/M$/, "", v)
              if (min == "" || v + 0 < min + 0) { min = v; line = $0 }
            }
        } END { print (line == "" ? "no samples captured" : line) }' "$SAMPLE_LOG"

        exit "$status"

    # Everything below only runs when the build step failed. `dmesg` needs sudo
    # on GitHub runners (kernel.dmesg_restrict=1) -- without it the OOM evidence
    # is silently unreadable, which is why earlier diagnostics came back empty.
    - name: Runner diagnostics (on failure)
      if: failure()
      shell: bash
      run: |
        DIAG="$RUNNER_TEMP/nix-failure-diagnostics.txt"
        exec > >(tee "$DIAG") 2>&1

        echo "=== last 40 resource samples (2s interval) ==="
        tail -n 40 "$RUNNER_TEMP/nix-build-samples.log" 2>/dev/null || echo "no sampler log"

        echo
        echo "=== kernel OOM kills ==="
        sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process' \
          || echo "no OOM lines in dmesg"

        echo
        echo "=== nix-daemon unit state ==="
        systemctl show nix-daemon.service \
          -p OOMPolicy -p ActiveState -p Result -p ExecMainStatus -p NRestarts
        sudo systemctl status nix-daemon.service --no-pager -l || true

        echo
        echo "=== journal: nix-daemon ==="
        sudo journalctl -u nix-daemon.service --no-pager -n 200 || true

        echo
        echo "=== journal: systemd-oomd ==="
        sudo journalctl -u systemd-oomd --no-pager -n 100 || true

        echo
        echo "=== disk / memory now ==="
        df -h /
        free -h

    - name: Upload diagnostics (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: nix-checks-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/nix-build-samples.log
          ${{ runner.temp }}/nix-failure-diagnostics.txt
        if-no-files-found: warn
        retention-days: 14
