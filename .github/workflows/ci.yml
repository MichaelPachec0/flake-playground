name: "CI"

# The merge gate: build every package and evaluate every module on PRs and on
# pushes to main/master. The heavy NixOS VM tests run in a second job, in
# parallel, so they neither block nor slow the gate. Same sets locally via
#   nix run nixpkgs#nix-fast-build -- --flake .#legacyPackages.x86_64-linux.ci.gate --impure
#   nix run nixpkgs#nix-fast-build -- --flake .#legacyPackages.x86_64-linux.ci.vm --impure
# or `nix build .#checks.x86_64-linux.default` for the gate.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A passing run builds for ~8 minutes (plus ~5 of runner setup and ~3 of
    # cache save). It used to also build the VM tests, ~10 more minutes that
    # pushed it past this limit; they now live in `vm-tests` below.
    #
    # Without a limit the GitHub default of 360 applies, and a hang burns six
    # runner-hours before anyone notices: run 31251212510 sat silent for 2h12m
    # after two nix-eval-jobs eval workers raced to unpack different flake
    # inputs into the same git cache, and only stopped because it was
    # cancelled by hand. 30 also makes the failure
    # USEFUL: a timeout is a failure, so the `if: failure()` diagnostics and
    # artifact upload below actually run, whereas a manual cancel skips them
    # and throws away the evidence.
    timeout-minutes: 30
    outputs:
      bundle-ok: ${{ steps.checks.outputs.bundle-ok }}
      bundle-artifact: ${{ steps.checks.outputs.bundle-artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run flake checks
        id: checks
        uses: ./.github/actions/nix-checks
        with:
          cache-backend: ${{ vars.NIX_CACHE_BACKEND || 'snapshot' }}
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}
          cache-bundle-set: gate
          cache-bundle-roots: ".#legacyPackages.x86_64-linux.ci.cacheRoots.gate"
          cache-bundle-artifact: nix-cache-gate-x86_64-linux

  # The NixOS VM integration tests (picr-vm, pingvin-share-vm, zipline-latest-vm,
  # zipline-latest-migration-vm). Separate from
  # `checks` so they run in parallel with it: they build for ~10 minutes, and
  # inside the gate they pushed it past its timeout. The pingvin bump workflow
  # still runs pingvin-share-vm itself before committing a source bump.
  vm-tests:
    runs-on: ubuntu-latest
    # ~10 minutes of build plus setup and cache save; same hang protection
    # rationale as `checks`. The zipline-latest VM tests also build the
    # zipline-latest package (pnpm build) in this job.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run VM tests
        uses: ./.github/actions/nix-checks
        with:
          flake-attr: ".#legacyPackages.x86_64-linux.ci.vm"
          # Own cache: the VM closures are large and would otherwise evict the
          # gate's cache (and the two jobs would race to save one key).
          cache-key-prefix: "nix-vm"
          # Read only: VM-test closures are not worth caching, so no bundle.
          cache-backend: ${{ vars.NIX_CACHE_BACKEND || 'snapshot' }}
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}

  # aarch64: every package that builds there, so aarch64 hosts (selene)
  # substitute instead of compiling. Only with the self-hosted cache (no
  # snapshot backend for it) and not for fork PRs, which would build the
  # whole set from scratch without secrets.
  checks-aarch64:
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    # actions: write only for the snapshot fallback (cache-nix-action purges
    # old entries through the API) when the self-hosted cache is unreachable.
    permissions:
      contents: read
      actions: write
    outputs:
      bundle-ok: ${{ steps.checks.outputs.bundle-ok }}
      bundle-artifact: ${{ steps.checks.outputs.bundle-artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build aarch64 packages
        id: checks
        uses: ./.github/actions/nix-checks
        with:
          flake-attr: ".#legacyPackages.aarch64-linux.ci.packages"
          cache-key-prefix: "nix-arm"
          cache-backend: selene
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}
          cache-bundle-set: gate
          cache-bundle-arch: aarch64-linux
          cache-bundle-roots: ".#legacyPackages.aarch64-linux.ci.cacheRoots.gate"
          cache-bundle-artifact: nix-cache-gate-aarch64-linux

  # Pushes run only with the self-hosted cache, never for pull requests, and
  # only for main (environment cache-push refuses other refs anyway).
  # tools-flake pins the nix-cache tools to the commit under test.
  push-gate:
    needs: checks
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && needs.checks.outputs.bundle-ok == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' }}
    permissions: {}
    uses: ./.github/workflows/nix-cache-push.yml
    with:
      repo: flake-playground
      set: gate
      arch: x86_64-linux
      artifact-name: ${{ needs.checks.outputs.bundle-artifact }}
      read-user: ${{ vars.NIX_CACHE_READ_USER }}
      tools-flake: github:${{ github.repository }}/${{ github.sha }}
    secrets:
      NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}

  push-gate-aarch64:
    needs: checks-aarch64
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && needs.checks-aarch64.outputs.bundle-ok == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' }}
    permissions: {}
    uses: ./.github/workflows/nix-cache-push.yml
    with:
      repo: flake-playground
      set: gate
      arch: aarch64-linux
      artifact-name: ${{ needs.checks-aarch64.outputs.bundle-artifact }}
      read-user: ${{ vars.NIX_CACHE_READ_USER }}
      tools-flake: github:${{ github.repository }}/${{ github.sha }}
    secrets:
      NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
