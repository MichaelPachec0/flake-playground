name: "Push to the nix cache"

# Reusable push job: sign a bundle produced by nix-cache-bundle and stream it
# to the cache host's write-only SSH account, then wait until the cache
# serves what the bundle carries. Runs in its own job with environment
# cache-push (main only), so build steps never share a VM with the signing or
# upload keys. Callers must not call it from pull_request runs: forks get no
# secrets, and the job refuses to run there anyway.
on:
  workflow_call:
    inputs:
      repo:
        description: "Repo name on the cache host (selects cache-drop-<repo>)."
        type: string
        required: true
      set:
        type: string
        required: true
      arch:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      read-user:
        description: "htpasswd user of NIX_CACHE_READ_TOKEN (for the verify step)."
        type: string
        required: true
      policy:
        description: "optional: a failure warns; required: a failure fails the run."
        type: string
        default: "optional"
      verify-timeout:
        description: "Seconds to wait for the cache to serve the bundled paths."
        type: number
        default: 600
      tools-flake:
        description: "Flake that provides the nix-cache package (nix-cache-push-bundle)."
        type: string
        default: "github:MichaelPachec0/flake-playground"
    secrets:
      NIX_CACHE_URL:
        description: "Cache URL (repo secret), for the verify step."
        required: true
      NIX_CACHE_READ_TOKEN:
        description: "Read token of read-user (repo secret), for the verify step."
        required: true
      # The four below are secrets of environment cache-push, which the push
      # job declares, so GitHub reads them from there: a caller cannot pass
      # environment secrets, and for a job with an environment the
      # environment's value wins over anything passed. They are declared
      # (optional) only so the interface lists them and linters accept the
      # references. Callers must not pass them.
      NIX_CACHE_SIGNING_KEY:
        description: "Environment cache-push: nix signing secret key (name:base64)."
        required: false
      NIX_CACHE_PUSH_SSH_KEY:
        description: "Environment cache-push: private SSH key of cache-drop-<repo>."
        required: false
      NIX_CACHE_SSH_HOST:
        description: "Environment cache-push: SSH host name of the cache host."
        required: false
      NIX_CACHE_SSH_KNOWN_HOSTS:
        description: "Environment cache-push: known_hosts line(s) pinning the host key."
        required: false

# Downloading an artifact of the same run needs no token scope.
permissions: {}

jobs:
  push:
    name: push ${{ inputs.set }} (${{ inputs.arch }})
    runs-on: ubuntu-latest
    environment: cache-push
    continue-on-error: ${{ inputs.policy == 'optional' }}
    timeout-minutes: 30
    permissions: {}
    steps:
      # Fail early and by name instead of with an ssh or nix error later.
      # Only emptiness is checked; the values themselves are never printed.
      - name: Check the inputs and secrets
        env:
          EVENT: ${{ github.event_name }}
          POLICY: ${{ inputs.policy }}
          REPO: ${{ inputs.repo }}
          READ_USER: ${{ inputs.read-user }}
          NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
          NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          NIX_CACHE_PUSH_SSH_KEY: ${{ secrets.NIX_CACHE_PUSH_SSH_KEY }}
          NIX_CACHE_SSH_HOST: ${{ secrets.NIX_CACHE_SSH_HOST }}
          NIX_CACHE_SSH_KNOWN_HOSTS: ${{ secrets.NIX_CACHE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request|pull_request_target)
              echo "::error::the nix cache push job must not run for $EVENT events"
              exit 1 ;;
          esac
          case "$POLICY" in optional|required) ;; *) echo "::error::policy must be optional or required"; exit 1 ;; esac
          # cache-drop-<repo> must be a valid user name of at most 32 characters.
          if ! printf %s "$REPO" | grep -Eqx '[a-z0-9][a-z0-9-]{0,20}'; then
            echo "::error::repo must be 1-21 characters of a-z, 0-9 and -"
            exit 1
          fi
          missing=""
          for name in NIX_CACHE_URL NIX_CACHE_READ_TOKEN NIX_CACHE_SIGNING_KEY \
            NIX_CACHE_PUSH_SSH_KEY NIX_CACHE_SSH_HOST NIX_CACHE_SSH_KNOWN_HOSTS READ_USER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing nix cache push secrets or inputs:$missing (environment cache-push holds the signing key, SSH key, host and known_hosts)"
            exit 1
          fi
          case "$NIX_CACHE_URL" in
            https://*) ;;
            *) echo "::error::NIX_CACHE_URL must use https://"; exit 1 ;;
          esac
          nl=$'\n'
          cr=$'\r'
          case "$NIX_CACHE_URL$NIX_CACHE_READ_TOKEN$READ_USER$NIX_CACHE_SSH_HOST" in
            *"$nl"*|*"$cr"*|*[[:space:]]*) echo "::error::nix cache URL, host, user or token contains whitespace"; exit 1 ;;
          esac

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: bundle

      - name: Check the bundle
        run: |
          set -euo pipefail
          # The paths end up in URLs and on nix's stdin, so only plain store
          # paths get through (nix base32 has no e, o, t or u).
          re='^/nix/store/[0-9a-df-np-sv-z]{32}-[A-Za-z0-9+._?=-]+$'
          jq -e --arg re "$re" '
            (.roots | type == "array" and length > 0 and all(type == "string" and test($re)))
            and (.paths | type == "array" and all(type == "string" and test($re)))
          ' bundle/manifest.json >/dev/null || { echo "::error::bundle/manifest.json is malformed"; exit 1; }
          echo "$(jq '.roots | length' bundle/manifest.json) roots, $(jq '.paths | length' bundle/manifest.json) paths to upload"

      - name: Install nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          count=$(jq '.paths | length' bundle/manifest.json)
          echo "$count paths to sign"
          [ "$count" -gt 0 ] || exit 0
          # Private key files live in KEYS_DIR (umask 077); the last step
          # deletes it whatever happened before.
          KEYS_DIR="$RUNNER_TEMP/nix-cache-push-keys"
          ( umask 077; mkdir -p "$KEYS_DIR"; printf '%s\n' "$SIGNING_KEY" > "$KEYS_DIR/signing-key" )
          jq -r '.paths[]' bundle/manifest.json \
            | nix store sign --store "file://$PWD/bundle" --key-file "$KEYS_DIR/signing-key" --stdin
          rm -f "$KEYS_DIR/signing-key"

      - name: Upload
        env:
          SSH_KEY: ${{ secrets.NIX_CACHE_PUSH_SSH_KEY }}
          SSH_HOST: ${{ secrets.NIX_CACHE_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.NIX_CACHE_SSH_KNOWN_HOSTS }}
          REPO: ${{ inputs.repo }}
          TOOLS_FLAKE: ${{ inputs.tools-flake }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SSH_HOST"
          KEYS_DIR="$RUNNER_TEMP/nix-cache-push-keys"
          ( umask 077; mkdir -p "$KEYS_DIR"
            printf '%s\n' "$SSH_KEY" > "$KEYS_DIR/ssh-key"
            printf '%s\n' "$KNOWN_HOSTS" > "$KEYS_DIR/known_hosts" )
          # Build the tool before the upload so a build failure is not
          # reported as an upload failure. This job has no read access to
          # the self-hosted cache, so it comes from source + cache.nixos.org.
          tools=$(nix build --no-link --print-out-paths "$TOOLS_FLAKE#nix-cache")
          # nix-cache-push-bundle tars exactly the members the receiver
          # accepts, zstd-compresses them and pipes them to the ssh command.
          # The host key is pinned: no trust on first use.
          status=0
          reply=$("$tools/bin/nix-cache-push-bundle" bundle \
            ssh -i "$KEYS_DIR/ssh-key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KEYS_DIR/known_hosts" \
              -o ConnectTimeout=30 "cache-drop-$REPO@$SSH_HOST") || status=$?
          rm -f "$KEYS_DIR/ssh-key" "$KEYS_DIR/known_hosts"
          case "$status" in
            0) ;;
            3) echo "::error::the cache host refused the bundle: over its size cap"; exit 1 ;;
            4) echo "::error::the cache host refused the bundle: empty upload"; exit 1 ;;
            255) echo "::error::ssh to the cache host failed (key, host key or network)"; exit 1 ;;
            *) echo "::error::upload failed with status $status"; exit 1 ;;
          esac
          if [ "$reply" != ok ]; then
            echo "::error::unexpected reply from the cache host"
            exit 1
          fi
          echo "bundle accepted by the cache host"

      - name: Verify the cache serves the bundled paths
        env:
          URL: ${{ secrets.NIX_CACHE_URL }}
          TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          READ_USER: ${{ inputs.read-user }}
          TIMEOUT: ${{ inputs.verify-timeout }}
        run: |
          set -euo pipefail
          # Only the paths the bundle carries are waited for. Roots outside
          # manifest.paths were already on this cache or are served by
          # upstream: the importer pins them (substituting upstream ones)
          # without the bundle carrying them, so they count as satisfied.
          # 200 means imported; the pin follows in the same importer run and
          # a pin failure is reported by the host's alerts, not here.
          total=$(jq '.paths | length' bundle/manifest.json)
          if [ "$total" -eq 0 ]; then
            echo "no paths uploaded; all $(jq '.roots | length' bundle/manifest.json) roots were already served"
            exit 0
          fi
          # The netrc and the curl config (which holds the URL) stay private.
          umask 077
          KEYS_DIR="$RUNNER_TEMP/nix-cache-push-keys"
          mkdir -p "$KEYS_DIR"
          host=$(printf %s "$URL" | sed -E 's#^https://([^/:]+).*#\1#')
          printf 'machine %s\nlogin %s\npassword %s\n' "$host" "$READ_USER" "$TOKEN" > "$KEYS_DIR/netrc"
          jq -r '.paths[]' bundle/manifest.json | sed -E 's#^/nix/store/(.{32}).*#\1#' > "$KEYS_DIR/pending"
          deadline=$((SECONDS + TIMEOUT))
          while :; do
            # One curl per round, one connection for all pending narinfos.
            # The URL goes through a config file, not argv.
            while read -r h; do
              printf 'url = "%s/%s.narinfo"\noutput = "/dev/null"\n' "${URL%/}" "$h"
            done < "$KEYS_DIR/pending" > "$KEYS_DIR/curl.conf"
            curl -s --proto =https --connect-timeout 10 --max-time 30 --netrc-file "$KEYS_DIR/netrc" \
              -w '%{http_code} %{url}\n' --config "$KEYS_DIR/curl.conf" > "$KEYS_DIR/codes" || true
            # Keep every hash that did not answer 200.
            awk '$1 == 200 { n = split($2, a, "/"); sub(/\.narinfo$/, "", a[n]); ok[a[n]] = 1 }
                 END { while ((getline h < pending) > 0) if (!(h in ok)) print h }' \
              pending="$KEYS_DIR/pending" "$KEYS_DIR/codes" > "$KEYS_DIR/pending.next"
            mv "$KEYS_DIR/pending.next" "$KEYS_DIR/pending"
            left=$(wc -l < "$KEYS_DIR/pending")
            echo "$((total - left)) of $total bundled paths served"
            [ "$left" -gt 0 ] || break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$left of $total bundled paths not served by the cache after ${TIMEOUT}s"
              exit 1
            fi
            sleep 10
          done
          echo "all $total bundled paths served"

      - name: Remove the keys
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/nix-cache-push-keys"
