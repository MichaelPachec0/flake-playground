name: "Bump picr"

# Daily: re-run nvfetcher for the picr source, build picr + picr-ping and run
# the module evals, and only commit the regenerated _sources when everything
# passes. Separate from the playground bump so the heavy from-source build runs
# in PARALLEL and commits a disjoint path (no _sources race).
on:
  schedule:
    - cron: "51 4 * * *"
  push:
    paths:
      - "nix/pkgs/picr/nvfetcher.toml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      bundle-ok: ${{ steps.checks.outputs.bundle-ok }}
      bundle-artifact: ${{ steps.checks.outputs.bundle-artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nix-checks has no build-command input (only pre-build-command), and its
      # own default build step targets .#checks.x86_64-linux, which does NOT
      # cover picr / picr-ping (they are kept out of mainPackages so the heavy
      # from-source build doesn't serialize behind the daily playground bump).
      # Chain the explicit build onto the nvfetcher run so it happens before the
      # composite action's own check pass.
      - name: Regenerate sources + build picr
        id: checks
        uses: ./.github/actions/nix-checks
        with:
          cache-backend: ${{ vars.NIX_CACHE_BACKEND || 'snapshot' }}
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}
          cache-bundle-set: bump-picr
          cache-bundle-roots: ".#legacyPackages.x86_64-linux.ci.cacheRoots.bump-picr"
          cache-bundle-artifact: nix-cache-bump-picr-x86_64-linux
          pre-build-command: >-
            nix run nixpkgs#nvfetcher --
            -c nix/pkgs/picr/nvfetcher.toml
            -o nix/pkgs/picr/_sources
            &&
            nix build -L
            .#picr .#picr-ping
            .#checks.x86_64-linux.nixos-picr
            .#checks.x86_64-linux.nixos-picr-secrets
            .#checks.x86_64-linux.nixos-picr-ping

      - name: Commit bumped sources
        id: commit
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: bump picr source"
          file_pattern: "nix/pkgs/picr/_sources/"
          skip_push: true

      - name: Push (rebase + retry)
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        uses: ./.github/actions/push-retry

  # Bump commits pushed with GITHUB_TOKEN do not trigger ci.yml, so this
  # workflow pushes its own set. Only with the self-hosted cache, never for
  # pull requests, and only on main (environment cache-push refuses other
  # refs anyway). tools-flake is the commit this run checked out: it exists
  # on the remote, unlike the bump commit, which push-retry creates later
  # (rebased, or not at all when nothing changed). It only supplies the
  # nix-cache tools; the bundle itself holds what this job built.
  push:
    needs: update
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && needs.update.outputs.bundle-ok == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' }}
    permissions: {}
    uses: ./.github/workflows/nix-cache-push.yml
    with:
      repo: flake-playground
      set: bump-picr
      arch: x86_64-linux
      artifact-name: ${{ needs.update.outputs.bundle-artifact }}
      read-user: ${{ vars.NIX_CACHE_READ_USER }}
      tools-flake: github:${{ github.repository }}/${{ github.sha }}
    secrets:
      NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
