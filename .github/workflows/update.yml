name: "Bump vim plugins"

# Daily: re-run nvfetcher for the tracked vim plugins, rebuild the FULL check
# set (every package + every module eval + the headless-nvim load test), and
# only commit the regenerated _sources when everything passes.
on:
  schedule:
    - cron: "23 4 * * *"
  push:
    paths:
      - "nix/pkgs/vimPlugins/nvfetcher.toml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # ~6 minutes when healthy. Caps the 360-minute GitHub default so a hung
    # eval (two nix-eval-jobs workers can deadlock unpacking flake inputs into
    # the same git cache) fails fast instead of burning six runner-hours. A
    # timeout counts as failure, so the nix-checks action's `if: failure()`
    # diagnostics still capture the stuck state; a manual cancel would not.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Regenerate sources + run flake checks
        uses: ./.github/actions/nix-checks
        with:
          pre-build-command: >-
            nix run nixpkgs#nvfetcher --
            -c nix/pkgs/vimPlugins/nvfetcher.toml
            -o nix/pkgs/vimPlugins/_sources

      - name: Commit bumped sources
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump vim plugin sources"
          file_pattern: "nix/pkgs/vimPlugins/_sources/"
