name: "Bump zipline-latest"

# Daily: re-run nvfetcher for the standalone zipline source, self-heal the pnpm
# deps hash, build the package, eval the module and run both zipline VM tests;
# commit the regenerated _sources and hash together only if everything passes.
#
# Separate from update-playground.yml on purpose: zipline has its own nvfetcher
# config (nix/pkgs/zipline/nvfetcher.toml), so a failure here (a yanked
# release, a lockfile that no longer fetches, a new upgrade precondition the
# VM tests catch) fails only this workflow.
on:
  schedule:
    - cron: "54 4 * * *"
  push:
    paths:
      - "nix/pkgs/zipline/nvfetcher.toml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # pnpm build + four VMs across two tests; same budget as pingvin.
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      bundle-ok: ${{ steps.checks.outputs.bundle-ok }}
      bundle-artifact: ${{ steps.checks.outputs.bundle-artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # heal-pnpm-hash.sh rewrites nix/pkgs/zipline/pnpm-deps.hash when the new
      # release changed pnpm-lock.yaml (warning, not failure); any other
      # pnpmDeps failure is fatal. The explicit build covers what the default
      # gate does not (zipline-latest is excluded from the gate aggregates).
      - name: Regenerate source + heal hash + build zipline
        id: checks
        uses: ./.github/actions/nix-checks
        with:
          cache-backend: ${{ vars.NIX_CACHE_BACKEND || 'snapshot' }}
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}
          cache-bundle-set: bump-zipline
          cache-bundle-roots: ".#legacyPackages.x86_64-linux.ci.cacheRoots.bump-zipline"
          cache-bundle-artifact: nix-cache-bump-zipline-x86_64-linux
          pre-build-command: >-
            nix run nixpkgs#nvfetcher --
            -c nix/pkgs/zipline/nvfetcher.toml
            -o nix/pkgs/zipline/_sources
            &&
            scripts/heal-pnpm-hash.sh zipline-latest nix/pkgs/zipline/pnpm-deps.hash
            &&
            nix build -L
            .#packages.x86_64-linux.zipline-latest
            .#checks.x86_64-linux.nixos-zipline-extras
            .#checks.x86_64-linux.zipline-latest-vm
            .#checks.x86_64-linux.zipline-latest-migration-vm

      - name: Commit bumped source
        id: commit
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: bump zipline source"
          # ONE LINE only: the action does `read -r -a` on this input, which
          # stops at the first newline (see update-projectsend.yml).
          file_pattern: "nix/pkgs/zipline/_sources/ nix/pkgs/zipline/pnpm-deps.hash"
          skip_push: true

      - name: Push (rebase + retry)
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        uses: ./.github/actions/push-retry

  # Bump commits pushed with GITHUB_TOKEN do not trigger ci.yml, so this
  # workflow pushes its own set. Only with the self-hosted cache, never for
  # pull requests, and only on main (environment cache-push refuses other
  # refs anyway). tools-flake is the commit this run checked out: it exists
  # on the remote, unlike the bump commit, which push-retry creates later
  # (rebased, or not at all when nothing changed). It only supplies the
  # nix-cache tools; the bundle itself holds what this job built.
  push:
    needs: update
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && needs.update.outputs.bundle-ok == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' }}
    permissions: {}
    uses: ./.github/workflows/nix-cache-push.yml
    with:
      repo: flake-playground
      set: bump-zipline
      arch: x86_64-linux
      artifact-name: ${{ needs.update.outputs.bundle-artifact }}
      read-user: ${{ vars.NIX_CACHE_READ_USER }}
      tools-flake: github:${{ github.repository }}/${{ github.sha }}
    secrets:
      NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
