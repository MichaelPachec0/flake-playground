name: "Bump projectsend package source"

# Daily: re-run nvfetcher for the standalone projectsend source, rebuild the
# FULL check set, and only commit the regenerated _sources when everything
# passes.
#
# Deliberately a SEPARATE workflow from update-playground.yml (which tracks
# nix/pkgs/playground) rather than an extra entry there: projectsend has its own
# standalone nvfetcher config (nix/pkgs/projectsend/nvfetcher.toml), and keeping
# its bump in its own workflow means a failure here (a yanked release, a moved
# asset URL) fails only this run and never blocks the playground or vimPlugins
# source bumps. No skopeo/registries workaround is needed: projectsend is a
# plain release-zip fetch (fetch.url), not an OCI image.
on:
  schedule:
    - cron: "52 4 * * *"
  push:
    paths:
      - "nix/pkgs/projectsend/nvfetcher.toml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # Match update-playground.yml: cap the 360-minute GitHub default so a hung
    # eval fails fast instead of burning runner-hours. A timeout counts as
    # failure, so the nix-checks action's `if: failure()` diagnostics still fire.
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      bundle-ok: ${{ steps.checks.outputs.bundle-ok }}
      bundle-artifact: ${{ steps.checks.outputs.bundle-artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate source + run flake checks
        id: checks
        uses: ./.github/actions/nix-checks
        with:
          cache-backend: ${{ vars.NIX_CACHE_BACKEND || 'snapshot' }}
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}
          cache-bundle-set: bump-projectsend
          cache-bundle-roots: ".#legacyPackages.x86_64-linux.ci.cacheRoots.bump-projectsend"
          cache-bundle-artifact: nix-cache-bump-projectsend-x86_64-linux
          pre-build-command: >-
            nix run nixpkgs#nvfetcher --
            -c nix/pkgs/projectsend/nvfetcher.toml
            -o nix/pkgs/projectsend/_sources

      - name: Commit bumped source
        id: commit
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: bump projectsend package source"
          # Keep this on ONE LINE if it ever grows a second entry -- NOT a YAML
          # block scalar. The action's entrypoint does
          # `read -r -a ARR <<< "$INPUT_FILE_PATTERN"`, and `read` stops at the
          # first newline, so a multi-line pattern silently degrades to its first
          # entry and everything below it is quietly left out of the commit.
          #
          # The directory pathspec covers the whole nvfetcher output
          # (generated.{nix,json}); `git add <dir>` stages creations AND
          # deletions, so a version bump commits cleanly.
          file_pattern: "nix/pkgs/projectsend/_sources/"
          skip_push: true

      - name: Push (rebase + retry)
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        uses: ./.github/actions/push-retry

  # Bump commits pushed with GITHUB_TOKEN do not trigger ci.yml, so this
  # workflow pushes its own set. Only with the self-hosted cache, never for
  # pull requests, and only on main (environment cache-push refuses other
  # refs anyway). tools-flake is the commit this run checked out: it exists
  # on the remote, unlike the bump commit, which push-retry creates later
  # (rebased, or not at all when nothing changed). It only supplies the
  # nix-cache tools; the bundle itself holds what this job built.
  push:
    needs: update
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && needs.update.outputs.bundle-ok == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' }}
    permissions: {}
    uses: ./.github/workflows/nix-cache-push.yml
    with:
      repo: flake-playground
      set: bump-projectsend
      arch: x86_64-linux
      artifact-name: ${{ needs.update.outputs.bundle-artifact }}
      read-user: ${{ vars.NIX_CACHE_READ_USER }}
      tools-flake: github:${{ github.repository }}/${{ github.sha }}
    secrets:
      NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
