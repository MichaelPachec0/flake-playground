name: "Update flake.lock"

# Weekly: bump the flake inputs (nixpkgs etc.), rebuild the FULL check set, and
# only commit flake.lock if everything still builds and every module still
# evaluates.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    # ~6 minutes when healthy. Caps the 360-minute GitHub default so a hung
    # eval (two nix-eval-jobs workers can deadlock unpacking flake inputs into
    # the same git cache) fails fast instead of burning six runner-hours. A
    # timeout counts as failure, so the nix-checks action's `if: failure()`
    # diagnostics still capture the stuck state; a manual cancel would not.
    # This job runs `nix flake update` first, so every input is refetched and
    # it is the most exposed of the four.
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      bundle-ok: ${{ steps.checks.outputs.bundle-ok }}
      bundle-artifact: ${{ steps.checks.outputs.bundle-artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update inputs + run flake checks
        id: checks
        uses: ./.github/actions/nix-checks
        with:
          cache-backend: ${{ vars.NIX_CACHE_BACKEND || 'snapshot' }}
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}
          cache-bundle-set: bump-flake-lock
          cache-bundle-roots: ".#legacyPackages.x86_64-linux.ci.cacheRoots.bump-flake-lock"
          cache-bundle-artifact: nix-cache-bump-flake-lock-x86_64-linux
          pre-build-command: "nix flake update"

      - name: Commit flake.lock
        id: commit
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: update flake.lock"
          file_pattern: "flake.lock"
          skip_push: true

      - name: Push (rebase + retry)
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        uses: ./.github/actions/push-retry

  # Bump commits pushed with GITHUB_TOKEN do not trigger ci.yml, so this
  # workflow pushes its own set. Only with the self-hosted cache, never for
  # pull requests, and only on main (environment cache-push refuses other
  # refs anyway). tools-flake is the commit this run checked out: it exists
  # on the remote, unlike the bump commit, which push-retry creates later
  # (rebased, or not at all when nothing changed). It only supplies the
  # nix-cache tools; the bundle itself holds what this job built.
  push:
    needs: lockfile
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && needs.lockfile.outputs.bundle-ok == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' }}
    permissions: {}
    uses: ./.github/workflows/nix-cache-push.yml
    with:
      repo: flake-playground
      set: bump-flake-lock
      arch: x86_64-linux
      artifact-name: ${{ needs.lockfile.outputs.bundle-artifact }}
      read-user: ${{ vars.NIX_CACHE_READ_USER }}
      tools-flake: github:${{ github.repository }}/${{ github.sha }}
    secrets:
      NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
