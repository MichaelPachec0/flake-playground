name: "Bump pingvin-share"

# Daily: re-run nvfetcher for the standalone pingvin-share source, build
# both pingvin-share-x and pingvin-share-x-beta, run the module eval check +
# VM test, commit regenerated _sources only if everything passes.
#
# Separate from update-playground.yml on purpose: pingvin-share has its own
# nvfetcher config (nix/pkgs/pingvin-share/nvfetcher.toml), so a failure
# here (yanked release, changed asset layout) fails only this workflow, not
# the playground/vimPlugins bumps.
on:
  schedule:
    - cron: "53 4 * * *"
  push:
    paths:
      - "nix/pkgs/pingvin-share/nvfetcher.toml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # Higher than picr's 45: also runs the pingvin-share-vm VM test on top
    # of two from-source npm builds.
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      bundle-ok: ${{ steps.checks.outputs.bundle-ok }}
      bundle-artifact: ${{ steps.checks.outputs.bundle-artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nix-checks has no build-command input (only pre-build-command); its
      # default build targets .#checks.x86_64-linux, which skips the
      # pingvin-share-x/-beta packages (excluded from the CI aggregate so
      # this heavy build doesn't serialize behind the daily playground
      # bump). Chain the explicit build onto nvfetcher so it runs before
      # the composite action's own check pass.
      - name: Regenerate sources + build pingvin
        id: checks
        uses: ./.github/actions/nix-checks
        with:
          cache-backend: ${{ vars.NIX_CACHE_BACKEND || 'snapshot' }}
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}
          cache-bundle-set: bump-pingvin
          cache-bundle-roots: ".#legacyPackages.x86_64-linux.ci.cacheRoots.bump-pingvin"
          cache-bundle-artifact: nix-cache-bump-pingvin-x86_64-linux
          pre-build-command: >-
            nix run nixpkgs#nvfetcher --
            -c nix/pkgs/pingvin-share/nvfetcher.toml
            -o nix/pkgs/pingvin-share/_sources
            &&
            nix build -L
            .#packages.x86_64-linux.pingvin-share-x
            .#packages.x86_64-linux.pingvin-share-x-beta
            .#checks.x86_64-linux.nixos-pingvin-share
            .#checks.x86_64-linux.pingvin-share-vm

      - name: Commit bumped sources
        id: commit
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: bump pingvin-share source"
          # ONE LINE only - see update-projectsend.yml: multi-line
          # file_pattern silently degrades to its first entry.
          file_pattern: "nix/pkgs/pingvin-share/_sources/"
          skip_push: true

      - name: Push (rebase + retry)
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        uses: ./.github/actions/push-retry

  # Bump commits pushed with GITHUB_TOKEN do not trigger ci.yml, so this
  # workflow pushes its own set. Only with the self-hosted cache, never for
  # pull requests, and only on main (environment cache-push refuses other
  # refs anyway). tools-flake is the commit this run checked out: it exists
  # on the remote, unlike the bump commit, which push-retry creates later
  # (rebased, or not at all when nothing changed). It only supplies the
  # nix-cache tools; the bundle itself holds what this job built.
  push:
    needs: update
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && needs.update.outputs.bundle-ok == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' }}
    permissions: {}
    uses: ./.github/workflows/nix-cache-push.yml
    with:
      repo: flake-playground
      set: bump-pingvin
      arch: x86_64-linux
      artifact-name: ${{ needs.update.outputs.bundle-artifact }}
      read-user: ${{ vars.NIX_CACHE_READ_USER }}
      tools-flake: github:${{ github.repository }}/${{ github.sha }}
    secrets:
      NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
