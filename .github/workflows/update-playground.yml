name: "Bump playground packages"

# Daily: re-run nvfetcher for the tracked playground packages, rebuild the FULL
# check set, and only commit the regenerated _sources when everything passes.
on:
  schedule:
    - cron: "37 4 * * *"
  push:
    paths:
      - "nix/pkgs/playground/nvfetcher.toml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # ~6 minutes when healthy. Caps the 360-minute GitHub default so a hung
    # eval (two nix-eval-jobs workers can deadlock unpacking flake inputs into
    # the same git cache) fails fast instead of burning six runner-hours. A
    # timeout counts as failure, so the nix-checks action's `if: failure()`
    # diagnostics still capture the stuck state; a manual cancel would not.
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      bundle-ok: ${{ steps.checks.outputs.bundle-ok }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate sources + run flake checks
        id: checks
        uses: ./.github/actions/nix-checks
        with:
          cache-backend: ${{ vars.NIX_CACHE_BACKEND || 'snapshot' }}
          cache-url: ${{ secrets.NIX_CACHE_URL }}
          cache-read-token: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          cache-read-user: ${{ vars.NIX_CACHE_READ_USER }}
          cache-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEYS }}
          cache-bundle-set: bump-playground
          cache-bundle-roots: ".#legacyPackages.x86_64-linux.ci.cacheRoots.bump-playground"
          cache-bundle-artifact: nix-cache-bump-playground-x86_64-linux
          # The affine-server* entries fetch OCI images via skopeo, which aborts
          # when the runner's /etc/containers/registries.conf is v1 format. The
          # ubuntu-latest runner ships a v1 file (containers-common), while
          # nixpkgs' skopeo requires v2 -> "registries.conf must be in v2 format
          # but is in v1". Point skopeo at a minimal v2 file for the nvfetcher run
          # (the env var propagates to the skopeo grandchild). This only bites on
          # a day the tracked release changes and a digest is actually re-fetched.
          # See nix/pkgs/playground/nvfetcher.toml for the same workaround locally.
          pre-build-command: >-
            printf 'unqualified-search-registries = ["docker.io"]\n' > /tmp/registries-v2.conf &&
            CONTAINERS_REGISTRIES_CONF=/tmp/registries-v2.conf
            nix run nixpkgs#nvfetcher --
            -c nix/pkgs/playground/nvfetcher.toml
            -o nix/pkgs/playground/_sources

      - name: Commit bumped sources
        id: commit
        if: ${{ success() }}
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: bump playground package sources"
          # Keep this on ONE LINE if it ever grows a second entry -- NOT a YAML
          # block scalar. The action's entrypoint does
          # `read -r -a ARR <<< "$INPUT_FILE_PATTERN"`, and `read` stops at the
          # first newline, so a multi-line pattern silently degrades to its first
          # entry and everything below it is quietly left out of the commit.
          #
          # The directory pathspec covers the whole nvfetcher output: generated.
          # {nix,json} plus the per-source directories holding the manifests it
          # `extract`s. `git add <dir>` stages creations AND deletions, so a
          # version bump commits the new extract directory and drops the old one
          # in the same commit (nvfetcher prunes the stale one itself).
          file_pattern: "nix/pkgs/playground/_sources/"
          skip_push: true

      - name: Push (rebase + retry)
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        uses: ./.github/actions/push-retry

  # Bump commits pushed with GITHUB_TOKEN do not trigger ci.yml, so this
  # workflow pushes its own set. Only with the self-hosted cache, never for
  # pull requests, and only on main (environment cache-push refuses other
  # refs anyway). tools-flake is the commit this run checked out: it exists
  # on the remote, unlike the bump commit, which push-retry creates later
  # (rebased, or not at all when nothing changed). It only supplies the
  # nix-cache tools; the bundle itself holds what this job built.
  push:
    needs: update
    if: ${{ vars.NIX_CACHE_BACKEND == 'selene' && needs.update.outputs.bundle-ok == 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' }}
    permissions: {}
    uses: ./.github/workflows/nix-cache-push.yml
    with:
      repo: flake-playground
      set: bump-playground
      arch: x86_64-linux
      artifact-name: nix-cache-bump-playground-x86_64-linux
      read-user: ${{ vars.NIX_CACHE_READ_USER }}
      tools-flake: github:${{ github.repository }}/${{ github.sha }}
    secrets:
      NIX_CACHE_URL: ${{ secrets.NIX_CACHE_URL }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
