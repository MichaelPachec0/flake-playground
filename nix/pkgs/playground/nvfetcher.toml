# Sources for the "playground" package set, tracked by nvfetcher (mirrors the
# nix/pkgs/vimPlugins setup). Each entry tracks the latest commit on the
# upstream default branch; the daily `update-playground.yml` workflow re-runs
# nvfetcher, rebuilds the `playground` check, and only commits the regenerated
# `_sources/` when that passes.
#
# Regenerate locally with:
#
#   nix develop -c nvfetcher -c nix/pkgs/playground/nvfetcher.toml -o nix/pkgs/playground/_sources
#   git add -AN nix/pkgs/playground/_sources
#
# That second line is not optional when an entry uses `extract` (see
# affine-mcp-server below): the extracted manifests land in a NEW directory named
# after the source hash, and a flake cannot see untracked files -- eval fails with
# "Path '...' in the repository is not tracked by Git" until they are at least
# intent-to-added. .github/actions/nix-checks does the same thing in CI.
#
# The affine-server* entries use `fetch.docker`, which shells out to
# `nix-prefetch-docker`/skopeo. skopeo (from nixpkgs) requires the containers
# registries config in v2 format; if the environment's
# /etc/containers/registries.conf is the old v1 format, it aborts
# ("registries.conf must be in v2 format but is in v1"). This bites BOTH local
# runs (many distros still ship a v1 file) AND CI (the GitHub ubuntu-latest
# runner ships a v1 registries.conf via containers-common) -- it is NOT a
# host-only quirk. It only fires on a run that actually re-fetches a digest
# (i.e. when the tracked release changed); steady-state runs skip the fetch.
# Override the config with a minimal v2 file for the run:
#
#   printf 'unqualified-search-registries = ["docker.io"]\n' > /tmp/registries-v2.conf
#   CONTAINERS_REGISTRIES_CONF=/tmp/registries-v2.conf \
#     nix develop -c nvfetcher -c nix/pkgs/playground/nvfetcher.toml -o nix/pkgs/playground/_sources
#
# The .github/workflows/update-playground.yml bump job applies this same override
# around its nvfetcher invocation, so the daily bump survives a release-day fetch.
#
# Per-package build metadata (cargoLock, meta, ...) lives next to default.nix,
# not here -- this file only pins where the source comes from.

[workstyle]
src.git = "https://github.com/pierrechevalier83/workstyle"
fetch.git = "https://github.com/pierrechevalier83/workstyle"

# ElectronMail: unofficial ProtonMail desktop client. Unlike workstyle (default
# branch), this tracks the latest GitHub *release* and fetches the prebuilt
# linux x86_64 AppImage asset. Note the version shape mismatch handled in the
# fetch URL: the release tag is `v$ver` but the asset filename uses the bare
# `$ver` (e.g. tag v5.3.8 -> electron-mail-5.3.8-linux-x86_64.AppImage).
[electron-mail]
src.github = "vladimiry/ElectronMail"
src.prefix = "v"
fetch.url = "https://github.com/vladimiry/ElectronMail/releases/download/v$ver/electron-mail-$ver-linux-x86_64.AppImage"

# AFFiNE self-host server. Tracked as an OCI image (no upstream source package).
# NOTE: nvfetcher's `src.container` is Docker-Hub-ONLY (its Haskell type has no
# registry field), so it cannot watch a ghcr.io image. Instead we DECOUPLE: watch
# AFFiNE's GitHub stable *releases* for the version (use_latest_release excludes
# the -canary/-beta prereleases; prefix strips the leading `v`), and fetch the
# matching image from ghcr via `fetch.docker` (skopeo speaks any registry).
#
# The upstream image is a multi-arch index; `docker.arch` selects one platform's
# manifest and pins its digest. We track amd64 and arm64 as SEPARATE entries (a
# single nvfetcher entry pins one arch's digest); nix/pkgs/playground/default.nix
# picks the entry matching the build's host platform. Both track the same release.
[affine-server]
src.github = "toeverything/AFFiNE"
src.use_latest_release = true
src.prefix = "v"
fetch.docker = "ghcr.io/toeverything/affine"
docker.os = "linux"
docker.arch = "amd64"

[affine-server-arm64]
src.github = "toeverything/AFFiNE"
src.use_latest_release = true
src.prefix = "v"
fetch.docker = "ghcr.io/toeverything/affine"
docker.os = "linux"
docker.arch = "arm64"

# DAWNCR0W/affine-mcp-server — write-capable MCP server for AFFiNE workspaces.
# Tracks the latest GitHub *release* (excludes prereleases) and fetches the repo
# at that tag as a source TREE (fetchFromGitHub) for buildNpmPackage.
#
# IMPORTANT: no `src.prefix = "v"` here. The upstream tags carry a leading `v`
# (e.g. v3.0.1). nvfetcher 0.8.0 has no rev-template for `fetch.github`, so it
# reuses the (post-prefix) version string verbatim as the git rev. Stripping the
# prefix would make it fetch rev `3.0.1` -> archive/3.0.1.tar.gz -> HTTP 404
# (only `v3.0.1` exists). So we keep the `v` in `version` and strip it at the
# package level instead (affine-mcp-server.nix: lib.removePrefix "v"). Do NOT use
# the electron-mail-style `fetch.url` tarball workaround: that makes `src` a
# tarball FILE, which breaks the deps-hash refresh (`$src/package-lock.json`
# needs `src` to be an unpacked directory).
#
# nvfetcher does NOT compute buildNpmPackage's npmDepsHash (it only emits hashes
# its own fetchers produce), and a hand-maintained companion hash file silently
# falls behind every source bump. `extract` sidesteps the hash entirely: it copies
# the named files out of the fetched tree into _sources/<sha>/ as ORDINARY REPO
# FILES, exposed as `source.extract."<file>"`. affine-mcp-server.nix feeds those
# to importNpmLock, which derives every dependency's hash from the integrity
# fields already inside package-lock.json -- so the deps update atomically with
# the source pin and there is no second hash to keep in sync.
#
# Extraction (rather than reading $src/package-lock.json) is what keeps eval pure:
# reading a file off the fetchFromGitHub store path would force a build during
# evaluation (import-from-derivation) and break the eval-only flake checks.
[affine-mcp-server]
src.github = "DAWNCR0W/affine-mcp-server"
src.use_latest_release = true
fetch.github = "DAWNCR0W/affine-mcp-server"
extract = [ "package.json", "package-lock.json" ]

# freebuff -- Codebuff's coding-agent CLI. Upstream's install path is
# `npx freebuff`, but that npm package is NOT the program: it is a ~64K launcher
# (index.js + launcher.js) that at runtime asks registry.npmjs.org for the latest
# version, downloads the real Bun-compiled binary from codebuff.com and caches it
# under ~/.config/freebuff, self-updating whenever npm moves. Wrapping that in a
# buildFHSEnv would pin nothing and put nothing in the store, so we skip the
# launcher and fetch the release tarball it would have downloaded
# (freebuff + tree-sitter.wasm) directly. See ./freebuff.nix.
#
# Two quirks force the unusual src/fetch split below:
#   1. nvfetcher 0.8.0 has NO npm version source (`src.npm` -> "Decode error at
#      '.src'"), so `src.webpage` scrapes the registry's `/latest` document --
#      npm stays the release source of truth, same as upstream's own launcher.
#      Do NOT swap this for `src.github` + `use_latest_release` on the release
#      repo below: that repo ships TWO products from one tag series, and the
#      `v1.0.x` codebuff tags dominate the release list -- `use_latest_release`
#      would track codebuff's version and build the wrong download URL. npm is
#      the only per-product version feed upstream exposes.
#   2. The binaries are NOT on npm. The launcher downloads them from
#      `codebuff.com/api/releases/download/$ver/<asset>`, which is a 301 to www
#      then a 302 into a PUBLIC GitHub release:
#      CodebuffAI/codebuff-community, tag `freebuff-v$ver`. We fetch that GitHub
#      URL directly -- same bytes, two fewer redirects, and no dependency on the
#      vendor's API route staying put. If a bump 404s, check whether the tag
#      scheme moved (and compare against the codebuff.com URL, which upstream's
#      own launcher still uses).
#
# ONE ENTRY PER PLATFORM. Each release is a set of per-target tarballs, so a
# single entry can only ever pin one platform; nix/pkgs/playground/default.nix
# selects the entry matching stdenv.hostPlatform (same arrangement as the
# affine-server amd64/arm64 split above). All entries track the same npm version.
#
# Tracked: x86_64-linux, aarch64-linux, aarch64-darwin. Upstream also publishes
# `freebuff-darwin-x64.tar.gz` (Intel Macs) and `freebuff-linux-x64-baseline.tar.gz`
# / `freebuff-win32-x64-baseline.tar.gz` (x86_64 CPUs without AVX2 -- the plain
# x64 build dies with SIGILL there). Adding one is a copy of a block below plus a
# line in default.nix; they are left out because nothing in this flake builds for
# them, and every extra entry re-downloads ~50-125MB on each version bump.
[freebuff-linux-x64]
src.webpage = "https://registry.npmjs.org/freebuff/latest"
src.regex = '"version":"([^"]+)"'
fetch.url = "https://github.com/CodebuffAI/codebuff-community/releases/download/freebuff-v$ver/freebuff-linux-x64.tar.gz"

[freebuff-linux-arm64]
src.webpage = "https://registry.npmjs.org/freebuff/latest"
src.regex = '"version":"([^"]+)"'
fetch.url = "https://github.com/CodebuffAI/codebuff-community/releases/download/freebuff-v$ver/freebuff-linux-arm64.tar.gz"

[freebuff-darwin-arm64]
src.webpage = "https://registry.npmjs.org/freebuff/latest"
src.regex = '"version":"([^"]+)"'
fetch.url = "https://github.com/CodebuffAI/codebuff-community/releases/download/freebuff-v$ver/freebuff-darwin-arm64.tar.gz"
