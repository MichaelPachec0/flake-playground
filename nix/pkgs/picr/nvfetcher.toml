# PICR: self-hosted photo-sharing server, tracked at its latest GitHub release.
# One source feeds both the server (picr) and the ping sidecar (picr-ping);
# both build from this same tree. Regenerate with:
#   nix run nixpkgs#nvfetcher -- -c nix/pkgs/picr/nvfetcher.toml -o nix/pkgs/picr/_sources
#
# Upstream ships THREE separate release lineages from the same repo: the
# server (bare semver tags, e.g. 1.6.2, tracking the root package.json), the
# mobile app (app-*/ios-*/android-* tags), and the ping sidecar (ping-v*
# tags). There is also a moving `latest` tag and per-platform lightroom-v*
# tags. Given that fragility, `src.use_latest_release` is set explicitly
# below (matching the affine-mcp-server / figmaqml convention in
# nix/pkgs/playground/nvfetcher.toml) rather than relying on it being
# nvfetcher's implicit default for `src.github`. use_latest_release reads
# GitHub's /releases/latest API (not a tag-name sort) and correctly resolves
# to the server's 1.6.2 release, not one of the app/ping/lightroom lineages.
# Verified locally: `git ls-remote --tags` plus a live nvfetcher run both
# confirm 1.6.2 is the newest server release and the one nvfetcher picks.
#
# Server tags here are bare (1.6.2), not v-prefixed, so src.prefix is not
# needed. If a future release moves to a vX.Y.Z scheme, set src.prefix = "v"
# (avoids the `vv...` archive-URL 404 -- see memory
# nvfetcher-github-release-appimage).
[picr]
src.github = "isaacinsoll/picr"
src.use_latest_release = true
fetch.github = "isaacinsoll/picr"
